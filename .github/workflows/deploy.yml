name: Refresh data and deploy RRG

on:
  push:
    branches: [main]
    paths:
      - 'sector-rotation-dashboard/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  issues:
    types: [opened, reopened, closed, edited]
  schedule:
    - cron: '17 23 * * 1-5'

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'issues' || (github.event.issue.user.login == 'charmedvie' && github.actor == 'charmedvie' && startsWith(github.event.issue.title, 'Stock screening: '))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sector-rotation-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test relative strength calculations
        run: python -m pytest -q
      - name: Validate dashboard JavaScript
        run: |
          node --check site/stocks.js
          node --test tests/test_stocks_ui.cjs
      - name: Fetch market data and calculate rotation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.generate_data --output site/data/rotation.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sector-rotation-dashboard/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
